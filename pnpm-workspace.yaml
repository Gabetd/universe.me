packages:
  - apps/*
  - packages/*

# pnpm 10 skips dependency install scripts unless they are listed here.
# esbuild's fetches its native binary. (Electron has no install script any more:
# it downloads its binary the first time it's required, see .github/actions/setup.)
onlyBuiltDependencies:
  - esbuild
# Squirrel.Windows installer helper pulled in by electron-builder; not used (we build NSIS + portable).
ignoredBuiltDependencies:
  - electron-winstaller
