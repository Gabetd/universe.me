name: CI

# Lint, typecheck, unit tests and the end-to-end tests on the dev build.
# Pushes to main and claude/** run build.yml instead, which checks the same and
# runs the end-to-end tests on the packaged apps (Linux, Windows 11 and 10).
on:
  push:
    branches-ignore: [main, 'claude/**']
  pull_request:

# Read-only unless a job says otherwise (only publishing writes).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          electron: binary
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # At the Windows runners' 1024×768, so it checks small screens too.
      - name: End-to-end tests (Electron under Xvfb, 1024×768)
        run: xvfb-run -a -s "-screen 0 1024x768x24" pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: apps/desktop/test-results/
          if-no-files-found: ignore
