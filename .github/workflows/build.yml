name: Build executables

# Builds installable apps for Windows, macOS and Linux on every push to dev,
# staging and main, and tests the packaged apps. New work goes to dev; what's
# ready goes on to staging, which also publishes the "staging-build" pre-release
# to try by hand; then to main, which publishes "latest-build", the release
# installed copies update themselves from. Both are signed (scripts/sign-update.mjs).
on:
  push:
    branches: [main, staging, dev]
  workflow_dispatch:

# Read-only unless a job says otherwise (only publishing writes).
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Alongside packaging rather than before it, so it adds nothing to the wait;
  # nothing is published unless it passes.
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      # Every build gets a higher version, so installed copies can tell they're out of date.
      VERSION: 0.1.${{ github.run_number }}
      # No code-signing certificates yet; don't let electron-builder search for them.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          electron: packaging
      - name: Stamp the build version
        working-directory: apps/desktop
        run: npm pkg set version=${{ env.VERSION }}
      - name: Build and package
        run: pnpm dist
      # Tarred, as artifacts don't keep the executable bit.
      - name: Keep the unpacked app for the tests
        if: runner.os != 'macOS'
        shell: bash
        run: tar -cf unpacked.tar -C apps/desktop/release ${{ runner.os == 'Windows' && 'win-unpacked' || 'linux-unpacked' }}
      - uses: actions/upload-artifact@v4
        if: runner.os != 'macOS'
        with:
          name: unpacked-${{ runner.os }}
          path: unpacked.tar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: universe-${{ runner.os }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb

  # The packaged apps' end-to-end tests, all at once. Windows Server 2025 is the
  # Windows 11 24H2 base; Server 2022 shares the Windows 10 (21H2) codebase, as
  # what's published has to run on Windows 10 too.
  test:
    name: Test on ${{ matrix.name }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, id: linux, os: ubuntu-latest, platform: Linux, app: linux-unpacked/universe-desktop, display: xvfb-run -a }
          - { name: Windows 11 (Server 2025), id: windows-11, os: windows-2025, platform: Windows, app: win-unpacked/Universe.exe, display: '' }
          - { name: Windows 10 (Server 2022), id: windows-10, os: windows-2022, platform: Windows, app: win-unpacked/Universe.exe, display: '' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: unpacked-${{ matrix.platform }}
      - name: Unpack the app
        shell: bash
        run: mkdir -p apps/desktop/release && tar -xf unpacked.tar -C apps/desktop/release
      - name: Run the packaged app's end-to-end tests
        working-directory: apps/desktop
        shell: bash
        run: UNIVERSE_E2E_EXECUTABLE="$PWD/release/${{ matrix.app }}" ${{ matrix.display }} npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.id }}
          path: apps/desktop/test-results

  publish:
    name: Publish ${{ github.ref_name }} build
    needs: [check, package, test]
    if: github.ref_name == 'main' || github.ref_name == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      # main's is the one installed copies update from; staging's is to try by hand first.
      TAG: ${{ github.ref_name == 'main' && 'latest-build' || 'staging-build' }}
    # One publish to a release at a time, so none deletes another's files mid-upload.
    concurrency:
      group: publish-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # The scripts, and the public key the signing key must match.
          sparse-checkout: |
            scripts
            apps/desktop/src/main/update-key.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: universe-*
          path: dist
          merge-multiple: true
      - name: Replace the ${{ env.TAG }} release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          short=$(echo "$GITHUB_SHA" | cut -c1-7)
          # Each fails, before anything is replaced, if an installer is missing or not stamped with this
          # version, or without the signing key (or with one the app doesn't check with).
          node scripts/update-manifest.mjs dist "0.1.${{ github.run_number }}" "$short" > update.json
          node scripts/sign-update.mjs update.json > update.signed.json
          cat > notes.md <<NOTES
          Automatic build of \`${GITHUB_REF_NAME}\` at ${short}.

          | Platform | Download |
          |---|---|
          | Windows 10 or 11 (64-bit) | \`Universe-*-windows-portable.exe\` runs without installing. \`Universe-*-win-x64.exe\` is the installer. |
          | macOS (Apple Silicon) | \`Universe-*-mac-arm64.dmg\` |
          | macOS (Intel) | \`Universe-*-mac-x64.dmg\` |
          | Linux | \`.AppImage\` (\`chmod +x\`, then run) or \`.deb\` |

          Version 0.1.${{ github.run_number }}. Installed copies offer to upgrade themselves when a newer build is published
          on main (the \`.zip\` files and the signed \`update.signed.json\` are for that).

          These builds are not code-signed yet. Windows SmartScreen: click **More info → Run anyway**.
          macOS: open the app once, then **System Settings → Privacy & Security → Open Anyway**.
          NOTES
          if [[ $GITHUB_REF_NAME == main ]]; then title="Latest build (${short})"; else title="Staging build (${short}): to try before it goes to main"; fi
          # Update the rolling release in place: deleting and recreating it races
          # with GitHub's tag cleanup and fails on transient API errors. The new
          # files go up before the old ones come down (each version's files have
          # their own names), so a download never finds the release empty.
          # (update.json, unsigned, is for copies from before signing: each takes one more update that way.)
          if gh release view "$TAG" >/dev/null 2>&1; then
            old=$(gh release view "$TAG" --json assets -q '.assets[].name')
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true
            gh release edit "$TAG" --prerelease --title "$title" --notes-file notes.md
            gh release upload "$TAG" dist/* --clobber
            # Then the manifests, so apps never see one that points at files not uploaded yet.
            gh release upload "$TAG" update.json update.signed.json --clobber
            for asset in $old; do
              [[ -e "dist/$asset" || $asset == update.json || $asset == update.signed.json ]] || gh release delete-asset "$TAG" "$asset" --yes
            done
          else
            gh release create "$TAG" dist/* --prerelease --target "$GITHUB_SHA" --title "$title" --notes-file notes.md
            gh release upload "$TAG" update.json update.signed.json --clobber
          fi
