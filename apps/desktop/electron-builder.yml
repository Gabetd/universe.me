appId: me.universe.app
productName: Universe
artifactName: Universe-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
# Main, preload and renderer are fully bundled by electron-vite, so the
# packaged app only needs the build output.
files:
  - out/**/*
  - package.json
asar: true
fileAssociations:
  - ext: universe
    name: Universe Project
    role: Editor
win:
  target:
    - target: portable
    - target: nsis
portable:
  artifactName: Universe-${version}-windows-portable.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    # The self-updater installs from the zip.
    - target: zip
      arch: [arm64, x64]
  # No Apple Developer certificate yet, so builds are ad-hoc signed ("-").
  # Apple Silicon refuses to run unsigned apps; ad-hoc signing is enough to launch after approving in Settings.
  identity: '-'
linux:
  category: Graphics
  target:
    - target: AppImage
    - target: deb
  maintainer: universe.me
  syncDesktopName: true
# CI passes --publish never and uploads artifacts itself, plus the update.json
# manifest the in-app updater reads (scripts/update-manifest.mjs).
publish:
  provider: github
  owner: Gabetd
  repo: universe.me
